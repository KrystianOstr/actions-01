name: My First Workflow

on: [push, fork]

jobs:
  build_job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: welcome message
        run: echo "Witaj"

      - name: list files
        run: ls

      - name: check path
        run: pwd

      - name: read file
        run: cat README.md

  test_job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: testing
        run: echo "testing..."

  deploy_job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: deploy the code
        run: echo "deploying..."